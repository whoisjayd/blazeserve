name: Bug report
description: Report a reproducible problem
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, tokens, keys and private data from everything you paste.
        Report security issues privately through the link on the issue chooser, not here.
        For a usage question, use this form and put "Question" at the start of the title.

  - type: input
    id: version
    attributes:
      label: BlazeServe version
      description: Output of `blaze version`.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS, version and architecture
      placeholder: Ubuntu 24.04 x86_64, Windows 11 x86_64, macOS 15 arm64
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - pip or uv
        - cargo
        - Release archive
        - Container
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local
        - Docker or Compose
        - Kubernetes
        - Behind a reverse proxy
        - Other
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that reproduces it, including the exact command or HTTP request.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: shell

  - type: textarea
    id: ai
    attributes:
      label: AI assistance
      description: Name any AI tools that helped with this report or will help with a fix, and the accountable human. Write "None" otherwise.
    validations:
      required: true
