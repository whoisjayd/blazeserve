name: Documentation
description: Report unclear, missing, or incorrect documentation
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BlazeServe's documentation. Please describe the exact page or section so the correction can be scoped.

  - type: input
    id: page-section
    attributes:
      label: Page or section
      description: Which documentation page, heading, or example needs attention?
      placeholder: e.g. DEPLOYMENT.md — Kubernetes uploads
    validations:
      required: true

  - type: textarea
    id: current-problem
    attributes:
      label: Current problem
      description: What is missing, incorrect, confusing, or out of date?
    validations:
      required: true

  - type: textarea
    id: proposed-correction
    attributes:
      label: Proposed correction
      description: Describe the wording, example, or technical correction that would make this clearer.
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Screenshots or examples
      description: Optional screenshots, links, or replacement examples. Remove private information before submitting.

  - type: textarea
    id: ai-assistance
    attributes:
      label: AI assistance disclosure
      description: If AI or automation assisted this report or proposed correction, name the tools, explain their role, and identify the accountable human who understands and will verify the work. Otherwise write "None."
    validations:
      required: true

  - type: checkboxes
    id: ai-accountability
    attributes:
      label: AI-assisted contribution policy
      options:
        - label: I disclosed AI or automation assistance above, or confirmed that none was used; I understand disclosure is for careful human review, not AI detection.
          required: true
