name: Question
description: Ask for usage or deployment help through GitHub Issues.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for usage questions, design exploration, and deployment advice. This helps route actionable context.

  - type: input
    id: version
    attributes:
      label: BlazeServe version
      placeholder: e.g. 0.3.1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Python version, OS, and deployment mode (local, Docker, Kubernetes, or reverse proxy).
      placeholder: e.g. Python 3.12 on Ubuntu 22.04, Docker
    validations:
      required: true

  - type: textarea
    id: command-request
    attributes:
      label: Command or HTTP request
      description: Paste the exact command or request, omitting credentials and other secrets.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: What result or behavior were you trying to achieve?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant configuration or sanitized logs, if useful. Do not include credentials, tokens, or private data.

  - type: textarea
    id: ai-assistance
    attributes:
      label: AI assistance disclosure
      description: If AI or automation assisted this question or proposed work, name the tools, explain their role, and identify the accountable human who will verify any contribution. Otherwise write "None."
    validations:
      required: true

  - type: checkboxes
    id: ai-accountability
    attributes:
      label: AI-assisted contribution policy
      options:
        - label: I disclosed AI or automation assistance above, or confirmed that none was used; I understand disclosure is for careful human review, not AI detection.
          required: true
