name: Set up Rust
description: Install a Rust toolchain and restore the cargo cache

inputs:
  toolchain:
    description: Toolchain channel or version
    default: stable
  components:
    description: Comma-separated toolchain components
    default: ""
  targets:
    description: Comma-separated extra targets
    default: ""
  cache-key:
    description: Extra cache key to separate builds
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
