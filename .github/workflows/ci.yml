name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  pull_request: # no paths-ignore: `ci result` must always run
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$|^LICENSE$|^\.gitignore$|^\.github/(ISSUE_TEMPLATE/|FUNDING\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Format and clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: quality
          shared-key: blaze
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - name: Keep operating system code in src/platform
        run: sh .github/scripts/platform-guard.sh
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    needs: [changes, quality]
    if: needs.changes.outputs.code == 'true' && needs.quality.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.93"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          cache-key: test-${{ matrix.toolchain }}
          shared-key: blaze
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --all-targets --locked
        env:
          # Windows runners have 7z; the others have unzip.
          BLAZE_EXPECT_UNZIP: "1"

  coverage:
    name: Coverage
    needs: [changes, quality]
    if: needs.changes.outputs.code == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          cache-key: coverage
          shared-key: blaze
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --fail-under-lines 80 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  deny:
    name: Advisories and licenses
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: deny
          shared-key: blaze
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny
      - run: cargo deny check

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  package:
    name: Wheel (${{ matrix.os }})
    needs: [changes, quality]
    if: needs.changes.outputs.code == 'true' && needs.quality.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: wheel-${{ matrix.os }}
          shared-key: blaze
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the wheel and, on Linux, the source distribution
        shell: bash
        run: |
          pipx run --spec 'maturin>=1.9.4,<2' maturin build --release --locked --out dist
          if [ "$RUNNER_OS" = Linux ]; then
            pipx run --spec 'maturin>=1.9.4,<2' maturin sdist --out dist
          fi
      - name: Check and smoke-test the wheel
        shell: bash
        run: |
          pipx run twine check dist/*
          python -m pip install --force-reinstall --no-index dist/*.whl
          blaze version
          python -m pip install --require-hashes -r tests_py/requirements.txt
          python -m pytest -q tests_py

  container:
    name: Container probes
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: blazeserve:ci
          cache-from: type=gha,scope=blazeserve-amd64
          cache-to: type=gha,scope=blazeserve-amd64,mode=max,ignore-error=true
      - uses: ./.github/actions/probe-container
        with:
          image: blazeserve:ci

  crate:
    name: Crate package
    needs: [changes, quality]
    if: needs.changes.outputs.code == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: crate
          shared-key: blaze
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo package --locked

  deploy-config:
    name: Deployment config
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned validators: Compose v5.7.0; kubectl v1.37.2; yq v4.54.2; Python v3.15.2; Bash v5.3.20;
    # Nginx v1.31.8; Caddy v2.11.9; Traefik v3.7.17.
    # systemd-analyze is the runner-provided Ubuntu version.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Docker Compose v5.7.0 from its Docker Hub image
        env:
          COMPOSE_VERSION: v5.7.0
        run: |
          set -Eeuo pipefail
          plugin="$HOME/.docker/cli-plugins/docker-compose"
          mkdir -p "$(dirname "$plugin")"
          id="$(docker create "docker/compose-bin:${COMPOSE_VERSION}" /docker-compose)"
          docker cp "$id:/docker-compose" "$plugin"
          docker rm "$id" > /dev/null
          chmod +x "$plugin"
          docker compose version
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Render Kubernetes base and validate Kubernetes YAML
        run: |
          set -Eeuo pipefail
          docker run --rm --mount type=bind,src="$PWD",dst=/work,readonly --workdir /work registry.k8s.io/kubectl:v1.37.2 kustomize deploy/k8s > /tmp/blazeserve-k8s.yaml
          docker run --rm --mount type=bind,src="$PWD",dst=/work,readonly --workdir /work mikefarah/yq:4.54.2 eval-all -e '.' deploy/k8s/*.yaml > /dev/null
          kinds="$(docker run --rm -i mikefarah/yq:4.54.2 eval -N -r '.kind' - < /tmp/blazeserve-k8s.yaml | sort)"
          test "$kinds" = $'Deployment\nService' || {
            printf 'default deploy/k8s base must render only Deployment and Service; got:\n%s\n' "$kinds" >&2
            exit 1
          }
      - name: Validate Linux tuning syntax and documented format subset
        run: |
          set -Eeuo pipefail
          docker run --rm --mount type=bind,src="$PWD",dst=/work,readonly bash:5.3.20 -n /work/deploy/linux-tuning/tuning.sh
          docker run --rm -i --mount type=bind,src="$PWD",dst=/work,readonly python:3.15.2-alpine3.24 python - <<'PY'
          from pathlib import Path
          import re

          root = Path("/work/deploy/linux-tuning")
          limits = [line.split() for line in root.joinpath("limits.conf").read_text().splitlines()
                    if line.strip() and not line.lstrip().startswith("#")]
          if not limits or any(
              len(fields) != 4
              or fields[0] != "blazeserve"
              or fields[1] not in {"soft", "hard"}
              or fields[2] not in {"nofile", "nproc"}
              or not fields[3].isdigit()
              or int(fields[3]) <= 0
              for fields in limits
          ):
              raise SystemExit("deploy/linux-tuning/limits.conf must use: blazeserve soft|hard nofile|nproc positive-integer")

          assignment = re.compile(r"[a-z0-9_.-]+\s*=\s*\S+(?:\s+\S+)*$")
          sysctl_lines = [line for line in root.joinpath("sysctl-blazeserve.conf").read_text().splitlines()
                          if line.strip() and not line.lstrip().startswith("#")]
          if not sysctl_lines or any(not assignment.fullmatch(line) for line in sysctl_lines):
              raise SystemExit("deploy/linux-tuning/sysctl-blazeserve.conf must use: lowercase.key = non-empty whitespace-separated value")
          PY
      - name: Validate reverse-proxy configuration
        run: |
          set -Eeuo pipefail
          docker run --rm --mount type=bind,src="$PWD/deploy/reverse-proxy/nginx.conf",dst=/etc/nginx/nginx.conf,readonly nginx:1.31.8-alpine nginx -t -c /etc/nginx/nginx.conf
          docker run --rm --mount type=bind,src="$PWD/deploy/reverse-proxy/Caddyfile",dst=/etc/caddy/Caddyfile,readonly caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          set +e
          timeout 5s docker run --rm --mount type=bind,src="$PWD/deploy/reverse-proxy",dst=/etc/traefik,readonly --entrypoint traefik traefik:v3.7.17 --configFile=/etc/traefik/traefik.yml
          status=$?
          set -e
          test "$status" -eq 124 || {
            printf 'Traefik configuration validation exited unexpectedly with status %s\n' "$status" >&2
            exit 1
          }
          docker run --rm --mount type=bind,src="$PWD",dst=/work,readonly --workdir /work mikefarah/yq:4.54.2 eval -e '.' deploy/reverse-proxy/traefik-dynamic.yml > /dev/null
      - name: Validate systemd unit without starting it
        # Unpinned: systemd-analyze comes from the runner image.
        run: |
          sudo ln -sf /bin/true /usr/local/bin/blaze
          trap 'sudo rm -f /usr/local/bin/blaze' EXIT
          systemd-analyze verify deploy/systemd/blazeserve.service

  result:
    name: ci result
    if: always()
    needs: [changes, quality, test, coverage, deny, dependency-review, package, container, crate, deploy-config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
