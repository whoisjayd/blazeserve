name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Format check with Ruff
        run: ruff format --check .
      - name: Type check with Mypy
        run: mypy blazeserve

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run Pytest with Coverage
        run: pytest -q --cov=blazeserve --cov-report=xml --cov-report=term-missing

  docker-smoke:
    name: Container Build & Probe Smoke Test
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        run: docker build -t blazeserve:ci .
      - name: Run Container & Verify Liveness Probe
        run: |
          docker run -d --name test-srv -p 8000:8000 blazeserve:ci
          sleep 4
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8000/__live__
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8000/__ready__
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8000/__metrics__
          docker stop test-srv

  build-package:
    name: Build & Validate Distribution Packages
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build Wheel & Sdist
        run: |
          python -m pip install -U pip build twine
          python -m build
          twine check dist/*
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
