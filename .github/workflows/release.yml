# Publishes one version to PyPI, crates.io and GHCR, then creates the GitHub release.
#
# Prerequisites
#   secret    PYPI_API_TOKEN, upload scope for the project (repository or pypi environment)
#   secret    CARGO_REGISTRY_TOKEN, publish scope for the crate (repository or crates-io environment)
#   variable  BLAZE_TELEMETRY_URL, the telemetry relay URL baked into release binaries, wheels and the image
#
# Run it from main with the exact version, or push a v* tag on a commit that is on main. Every gate passes
# before any publisher starts. PyPI files and crates.io versions are immutable, so a version is never reused.
# If one publisher fails, rerun the failed jobs: PyPI skips files it already has, the crate job skips a
# version that is already on crates.io, and the GitHub release waits for all three.
#
# After the first release, crates.io Trusted Publishing can replace CARGO_REGISTRY_TOKEN: configure the
# publisher on crates.io, grant the publish-crate job id-token: write, and authenticate with
# rust-lang/crates-io-auth-action. It cannot be set up before the crate exists.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal Cargo.toml and pyproject.toml
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    name: Validate identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Match requested version, tag and package metadata
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if cargo != pyproject:
              raise SystemExit(f"Cargo.toml {cargo!r} != pyproject.toml {pyproject!r}")

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              requested = os.environ["REQUESTED_VERSION"]
              if requested != cargo:
                  raise SystemExit(f"Requested {requested!r} != crate version {cargo!r}")
              tag = f"v{cargo}"
          else:
              tag = os.environ["REF_NAME"]
              if tag != f"v{cargo}":
                  raise SystemExit(f"Tag {tag!r} != crate version {cargo!r}")

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"version={cargo}\ntag={tag}\n")
          PY
      - name: Require release commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main
      - name: Require a new tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi

  quality:
    name: Format and clippy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo test --all-targets --locked

  container-gate:
    name: Container probes
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: BLAZE_TELEMETRY_URL=${{ vars.BLAZE_TELEMETRY_URL }}
          tags: blazeserve:release-gate
      - uses: ./.github/actions/probe-container
        with:
          image: blazeserve:release-gate

  crate-gate:
    name: Crate package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo package --locked

  binaries:
    name: Binary (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, ext: tar.gz }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, ext: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          BLAZE_TELEMETRY_URL: ${{ vars.BLAZE_TELEMETRY_URL }}
      - name: Archive
        shell: bash
        env:
          NAME: blazeserve-${{ needs.validate.outputs.tag }}-${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$NAME" dist
          exe=blaze
          [ "$EXT" = zip ] && exe=blaze.exe
          cp "target/$TARGET/release/$exe" LICENSE README.md "$NAME/"
          if [ "$EXT" = zip ]; then
            7z a "dist/$NAME.zip" "$NAME" >/dev/null
          else
            tar -czf "dist/$NAME.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wheels:
    name: Wheel (${{ matrix.os }}, ${{ matrix.target }}, ${{ matrix.manylinux || 'native' }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64, os: ubuntu-latest, manylinux: auto }
          - { target: aarch64, os: ubuntu-24.04-arm, manylinux: auto }
          - { target: x86_64, os: ubuntu-latest, manylinux: musllinux_1_2 }
          - { target: aarch64, os: ubuntu-24.04-arm, manylinux: musllinux_1_2 }
          - { target: x64, os: windows-latest }
          - { target: x86_64, os: macos-latest }
          - { target: aarch64, os: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        env:
          BLAZE_TELEMETRY_URL: ${{ vars.BLAZE_TELEMETRY_URL }}
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e BLAZE_TELEMETRY_URL
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: pipx run --spec 'maturin>=1.9.4,<2' maturin sdist --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  assets:
    name: Checksums and provenance
    needs: [validate, quality, test, container-gate, crate-gate, binaries, wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{bin-*,wheel-*,sdist}"
          path: staging
          merge-multiple: true
      - name: Verify distributions and write checksums
        run: |
          pipx run twine check staging/*.whl staging/blazeserve-[0-9]*.tar.gz
          mkdir -p dist release
          mv staging/*.whl staging/blazeserve-[0-9]*.tar.gz dist/
          mv staging/* release/
          (cd release && sha256sum * | tee SHA256SUMS)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
            release/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

  publish-package:
    name: Publish to PyPI
    needs: [validate, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true

  publish-crate:
    name: Publish to crates.io
    needs: [validate, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Publish unless this version is already on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          : "${CARGO_REGISTRY_TOKEN:?The CARGO_REGISTRY_TOKEN secret is not set}"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A "blazeserve-release (https://github.com/${GITHUB_REPOSITORY})" "https://crates.io/api/v1/crates/blazeserve/${VERSION}")"
          case "$status" in
            200) echo "blazeserve ${VERSION} is already on crates.io; nothing to publish" ;;
            404) cargo publish --locked ;;
            *) echo "Unexpected crates.io response ${status}" >&2; exit 1 ;;
          esac

  publish-container:
    name: Publish to GHCR
    needs: [validate, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: BLAZE_TELEMETRY_URL=${{ vars.BLAZE_TELEMETRY_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub release
    needs: [validate, publish-package, publish-crate, publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BlazeServe ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: release/*
