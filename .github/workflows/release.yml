# Publishes one version to PyPI, crates.io and GHCR, then creates the GitHub release.
#
# Prerequisites
#   secret    PYPI_API_TOKEN, upload scope for the project (repository or pypi environment)
#   secret    CARGO_REGISTRY_TOKEN, publish scope for the crate (repository or crates-io environment)
#   secret    BLAZE_POSTHOG_KEY, the public PostHog project key (phc_...) baked into release builds
#   variable  BLAZE_POSTHOG_HOST, optional PostHog host; the EU cloud when unset
#
# A manual run is a dry run unless dry_run is unchecked: it builds and tests everything and publishes
# nothing. To release, run it from main with the exact version and dry_run unchecked, or push a v* tag on
# a commit that is on main. Every gate passes before any publisher starts. PyPI files and crates.io
# versions are immutable, so a version is never reused.
# If one publisher fails, rerun the failed jobs: PyPI skips files it already has, the crate job skips a
# version that is already on crates.io, and the GitHub release waits for all three.
#
# After the first release, crates.io Trusted Publishing can replace CARGO_REGISTRY_TOKEN: configure the
# publisher on crates.io, grant the publish-crate job id-token: write, and authenticate with
# rust-lang/crates-io-auth-action. It cannot be set up before the crate exists.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal Cargo.toml and pyproject.toml
        required: true
        type: string
      dry_run:
        description: Build and test everything, publish nothing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    name: Validate identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Match requested version, tag and package metadata
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if cargo != pyproject:
              raise SystemExit(f"Cargo.toml {cargo!r} != pyproject.toml {pyproject!r}")

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              requested = os.environ["REQUESTED_VERSION"]
              if requested != cargo:
                  raise SystemExit(f"Requested {requested!r} != crate version {cargo!r}")
              tag = f"v{cargo}"
          else:
              tag = os.environ["REF_NAME"]
              if tag != f"v{cargo}":
                  raise SystemExit(f"Tag {tag!r} != crate version {cargo!r}")

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"version={cargo}\ntag={tag}\n")
          PY
      - name: Require release commit on main
        if: github.event_name == 'push' || !inputs.dry_run
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main
      - name: Require a new tag for manual dispatch
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi

  quality:
    name: Format and clippy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: quality
          shared-key: blaze
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-stable
          shared-key: blaze
          save-if: false
      - run: cargo test --all-targets --locked

  container-gate:
    name: Container probes
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          build-args: |
            BLAZE_POSTHOG_KEY=${{ secrets.BLAZE_POSTHOG_KEY || vars.BLAZE_POSTHOG_KEY }}
            BLAZE_POSTHOG_HOST=${{ vars.BLAZE_POSTHOG_HOST }}
          tags: blazeserve:release-gate
          cache-from: type=gha,scope=blazeserve-amd64
          cache-to: type=gha,scope=blazeserve-amd64,mode=max,ignore-error=true
      - uses: ./.github/actions/probe-container
        with:
          image: blazeserve:release-gate

  crate-gate:
    name: Crate package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: crate
          shared-key: blaze
          save-if: false
      - run: cargo package --locked

  binaries:
    name: Binary (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, ext: tar.gz }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, ext: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
          shared-key: blaze
          save-if: false
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          BLAZE_POSTHOG_KEY: ${{ secrets.BLAZE_POSTHOG_KEY || vars.BLAZE_POSTHOG_KEY }}
          BLAZE_POSTHOG_HOST: ${{ vars.BLAZE_POSTHOG_HOST }}
      - name: Check debug test knobs are absent from release binary
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/blaze"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          strings "$bin" > "$tmp"
          if grep -E 'BLAZE_CRASH_AT|BLAZE_CRASH_AFTER|BLAZE_FREE|BLAZE_PANIC_AT' "$tmp"; then
            echo "debug test knob found in release binary: $bin" >&2
            exit 1
          fi
      - name: Smoke-test native release binary
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_KEY: ${{ secrets.BLAZE_POSTHOG_KEY || vars.BLAZE_POSTHOG_KEY }}
        run: |
          set -euo pipefail
          exe=blaze
          [ "$EXT" = zip ] && exe=blaze.exe
          bin="target/$TARGET/release/$exe"
          if command -v python3 >/dev/null 2>&1 && python3 --version >/dev/null 2>&1; then
            py=python3
          else
            py=python
          fi
          "$py" - "$bin" "$EXPECTED_VERSION" "$EXPECTED_KEY" <<'PY'
          import json
          import os
          import pathlib
          import socket
          import subprocess
          import sys
          import tempfile

          bin_path = str(pathlib.Path(sys.argv[1]).resolve())
          expected_version, expected_key = sys.argv[2:4]

          def run(args, env):
              return subprocess.run(
                  [bin_path, *args],
                  env=env,
                  text=True,
                  capture_output=True,
                  timeout=30,
              )

          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as tmp:
              root = pathlib.Path(tmp)
              config_dir = root / "config"
              state_dir = root / "state"
              serve_dir = root / "serve"
              out_dir = root / "out"
              for d in (config_dir, state_dir, serve_dir, out_dir):
                  d.mkdir()

              base_env = os.environ.copy()
              base_env.pop("BLAZE_POSTHOG_KEY", None)
              base_env.pop("BLAZE_POSTHOG_HOST", None)
              base_env["BLAZE_CONFIG_DIR"] = str(config_dir)
              base_env["BLAZE_STATE_DIR"] = str(state_dir)
              base_env["NO_COLOR"] = "1"
              base_env["CI"] = "1"

              ver = run(["--version"], base_env)
              assert ver.returncode == 0, ver.stderr
              assert expected_version in ver.stdout, ver.stdout

              ver_json = run(["version", "--json"], base_env)
              assert ver_json.returncode == 0, ver_json.stderr
              info = json.loads(ver_json.stdout)
              assert info["name"] == "blazeserve", info
              assert info["version"] == expected_version, info

              tel = run(["telemetry", "status"], base_env)
              assert tel.returncode == 0, tel.stderr
              if expected_key:
                  assert "configured" in tel.stdout and "not configured" not in tel.stdout, tel.stdout
                  assert expected_key.encode("utf-8") in pathlib.Path(bin_path).read_bytes(), (
                      "the PostHog project key is missing from the binary"
                  )
              else:
                  assert "not configured" in tel.stdout, tel.stdout

              payload = b"blazeserve-release-smoke\n" * 1024
              (serve_dir / "smoke.bin").write_bytes(payload)

              job_id = None
              port = None
              last_err = ""
              for _ in range(3):
                  with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                      sock.bind(("127.0.0.1", 0))
                      candidate = sock.getsockname()[1]
                  started = run(
                      ["serve", str(serve_dir), "--host", "127.0.0.1", "--port", str(candidate), "--background"],
                      base_env,
                  )
                  if started.returncode == 0:
                      job_id = started.stdout.strip()
                      port = candidate
                      break
                  last_err = started.stderr
              assert job_id and port, f"failed to start background server: {last_err}"

              stop_res = None
              try:
                  dest = out_dir / "smoke.bin"
                  got = run(["get", f"http://127.0.0.1:{port}/smoke.bin", "-o", str(dest)], base_env)
                  assert got.returncode == 0, got.stderr
                  assert dest.read_bytes() == payload, "downloaded bytes differ from served file"
              finally:
                  stop_res = run(["stop", job_id, "--yes"], base_env)
              assert stop_res.returncode == 0, stop_res.stderr
          PY
      - name: Archive
        shell: bash
        env:
          NAME: blazeserve-${{ needs.validate.outputs.tag }}-${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$NAME" dist
          exe=blaze
          [ "$EXT" = zip ] && exe=blaze.exe
          cp "target/$TARGET/release/$exe" LICENSE README.md "$NAME/"
          if [ "$EXT" = zip ]; then
            7z a "dist/$NAME.zip" "$NAME" >/dev/null
          else
            tar -czf "dist/$NAME.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wheels:
    name: Wheel (${{ matrix.os }}, ${{ matrix.target }}, ${{ matrix.manylinux || 'native' }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64, os: ubuntu-latest, manylinux: auto }
          - { target: aarch64, os: ubuntu-24.04-arm, manylinux: auto }
          - { target: x86_64, os: ubuntu-latest, manylinux: musllinux_1_2 }
          - { target: aarch64, os: ubuntu-24.04-arm, manylinux: musllinux_1_2 }
          - { target: x64, os: windows-latest }
          - { target: x86_64, os: macos-latest }
          - { target: aarch64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          shared-key: blaze
          save-if: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          BLAZE_POSTHOG_KEY: ${{ secrets.BLAZE_POSTHOG_KEY || vars.BLAZE_POSTHOG_KEY }}
          BLAZE_POSTHOG_HOST: ${{ vars.BLAZE_POSTHOG_HOST }}
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e BLAZE_POSTHOG_KEY -e BLAZE_POSTHOG_HOST
          args: --release --locked --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec 'maturin>=1.9.4,<2' maturin sdist --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  assets:
    name: Checksums and provenance
    needs: [validate, quality, test, container-gate, crate-gate, binaries, wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{bin-*,wheel-*,sdist}"
          path: staging
          merge-multiple: true
      - name: Verify distributions and write checksums
        run: |
          pipx run twine check staging/*.whl staging/blazeserve-[0-9]*.tar.gz
          mkdir -p dist release
          mv staging/*.whl staging/blazeserve-[0-9]*.tar.gz dist/
          mv staging/* release/
          (cd release && sha256sum * | tee SHA256SUMS)
      # An attestation is a public, permanent record, so a dry run must not create one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' || !inputs.dry_run
        with:
          subject-path: |
            dist/*
            release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

  publish-package:
    name: Publish to PyPI
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [validate, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true

  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [validate, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: crate
          shared-key: blaze
          save-if: false
      - name: Publish unless this version is already on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          : "${CARGO_REGISTRY_TOKEN:?The CARGO_REGISTRY_TOKEN secret is not set}"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A "blazeserve-release (https://github.com/${GITHUB_REPOSITORY})" "https://crates.io/api/v1/crates/blazeserve/${VERSION}")"
          case "$status" in
            200) echo "blazeserve ${VERSION} is already on crates.io; nothing to publish" ;;
            404) cargo publish --locked ;;
            *) echo "Unexpected crates.io response ${status}" >&2; exit 1 ;;
          esac

  publish-container:
    name: Publish to GHCR
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [validate, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            BLAZE_POSTHOG_KEY=${{ secrets.BLAZE_POSTHOG_KEY || vars.BLAZE_POSTHOG_KEY }}
            BLAZE_POSTHOG_HOST=${{ vars.BLAZE_POSTHOG_HOST }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,ignore-error=true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub release
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [validate, publish-package, publish-crate, publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release/
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BlazeServe ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: release/*
