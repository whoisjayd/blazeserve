name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must exactly match project.version in pyproject.toml"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Match requested version, tag, and package metadata
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          event_name = os.environ["EVENT_NAME"]
          ref_name = os.environ["REF_NAME"]
          requested_version = os.environ.get("REQUESTED_VERSION", "")

          if event_name == "workflow_dispatch":
              if requested_version != project_version:
                  raise SystemExit(
                      f"Requested version {requested_version!r} does not match pyproject.toml version {project_version!r}"
                  )
              tag = f"v{project_version}"
          else:
              tag = ref_name
              if tag != f"v{project_version}":
                  raise SystemExit(
                      f"Tag {tag!r} does not match pyproject.toml version {project_version!r}"
                  )

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={project_version}\n")
              output.write(f"tag={tag}\n")
          PY
      - name: Require release commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main
      - name: Require a new tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi

  quality:
    name: Code quality gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run Mypy
        run: uv run mypy blazeserve
  test:
    name: Test gate (Python ${{ matrix.python-version }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run tests concurrently
        run: uv run pytest -n auto --cov=blazeserve --cov-report=term-missing

  package:
    name: Package gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Build and validate distributions
        run: |
          uv run python -m build
          uv run twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  container:
    name: Container gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: blazeserve:release-gate
      - name: Verify container probes
        run: |
          docker run -d --name blazeserve-release -p 8000:8000 blazeserve:release-gate
          trap 'docker rm -f blazeserve-release' EXIT
          sleep 4
          curl --fail --retry 5 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/__live__
          curl --fail --retry 5 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/__ready__

  publish-package:
    name: Publish package to PyPI
    needs: [validate, quality, test, package, container]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Publish through PyPI API token
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          username: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

  publish-container:
    name: Publish container to GHCR
    needs: [validate, quality, test, package, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest

  github-release:
    name: Create GitHub release
    needs: [validate, publish-package, publish-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release and tag manual dispatches
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BlazeServe ${{ needs.validate.outputs.version }}
          generate_release_notes: true
