[package]
name = "blazeserve"
version = "1.1.0"
edition = "2024"
rust-version = "1.93"
description = "High-performance HTTP file server and CLI with range requests, resumable transfers, caching, TLS, uploads, ZIP streaming, rate limiting, and Prometheus metrics."
license = "MIT"
repository = "https://github.com/whoisjayd/blazeserve"
readme = "README.md"
keywords = ["http", "file-server", "static", "range", "cli"]
categories = ["command-line-utilities", "web-programming::http-server"]
include = ["/src/**", "/python/**", "/tests/**", "/tests_py/**", "/Cargo.toml", "/Cargo.lock", "/pyproject.toml", "/README.md", "/LICENSE"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/blazeserve-v{ version }-{ target }.{ archive-format }"
bin-dir = "blazeserve-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
name = "blazeserve"
path = "src/lib.rs"

[[bin]]
name = "blaze"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "io-std", "sync", "time", "signal"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
socket2 = { version = "0.6", features = ["all"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
base64 = { version = "0.23", default-features = false, features = ["std"] }
percent-encoding = "2"
httpdate = "1"
mime_guess = "2"
lru = "0.19"
getrandom = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }

opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "metrics"], optional = true }
opentelemetry-http = { version = "0.33", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }
clap_complete = "4"
pyo3 = { version = "0.30", default-features = false, features = ["abi3-py311", "macros"], optional = true }
indicatif = "0.18"
anstream = "1"
anstyle = "1"
qrcode = { version = "0.14.1", default-features = false }
globset = { version = "0.4.21", default-features = false }

# `blaze upgrade` reads the release archives (.tar.gz on Unix, .zip on Windows). All three are already
# in the tree through hatchzip-core; tar drops its xattr/filetime defaults and zip keeps only deflate.
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

# In-place archive extraction for `blaze get --extract`. It builds the bundled zstd C source
# through `zip`, so building from source needs a C compiler; no system library is used.
hatchzip-core = { version = "0.1.10", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[features]
default = ["otel", "extract"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:async-trait"]
python = ["dep:pyo3"]
extract = ["dep:hatchzip-core"]

[dev-dependencies]
tempfile = "3"
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rqrr = "0.11"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
unused_must_use = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
