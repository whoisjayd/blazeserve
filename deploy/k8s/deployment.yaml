apiVersion: apps/v1
kind: Deployment
metadata:
  name: blazeserve
  namespace: default
  labels:
    app.kubernetes.io/name: blazeserve
    app.kubernetes.io/part-of: edge-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blazeserve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blazeserve
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blazeserve
          image: ghcr.io/whoisjayd/blazeserve:v0.3.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "/data", "--host", "0.0.0.0", "--port", "8000", "--log-json"]
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /__live__
              port: http
            timeoutSeconds: 3
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /__ready__
              port: http
            timeoutSeconds: 3
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
