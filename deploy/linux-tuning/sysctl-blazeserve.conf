# BlazeServe Linux Kernel High-Throughput HTTP Tuning
# Apply via: sudo sysctl -p /etc/sysctl.d/99-blazeserve.conf

# Maximum queue length of completely established sockets waiting to be accepted
net.core.somaxconn = 65535

# Maximum number of remembered connection requests (SYN backlog)
net.ipv4.tcp_max_syn_backlog = 32768

# Maximum number of packets in the input queue before discarding
net.core.netdev_max_backlog = 16384

# Time to hold socket in FIN-WAIT-2 state before closing (seconds)
net.ipv4.tcp_fin_timeout = 15

# Enable fast recycling of TIME-WAIT sockets for outgoing connections
net.ipv4.tcp_tw_reuse = 1

# TCP receive buffer sizes: min, default, max (16MB)
net.ipv4.tcp_rmem = 4096 87380 16777216

# TCP send buffer sizes: min, default, max (16MB)
net.ipv4.tcp_wmem = 4096 65536 16777216

# Maximum socket receive and send buffer sizes
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Maximum number of open file descriptors system-wide
fs.file-max = 2097152

# Reduce memory swap tendency to preserve page cache for I/O
vm.swappiness = 10
