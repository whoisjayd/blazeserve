groups:
  - name: blazeserve_alerts
    rules:
      - alert: BlazeServeInstanceDown
        expr: up{job="blazeserve"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "BlazeServe instance {{ $labels.instance }} is down"
          description: "Scrapes have failed for more than 30 seconds."

      - alert: BlazeServeHighErrorRate
        expr: rate(blazeserve_errors_total[2m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Elevated error rate on {{ $labels.instance }}"
          description: "More than 5 server errors per second over the last 2 minutes."

      - alert: BlazeServeHighActiveRequests
        expr: blazeserve_requests_active > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High in-flight requests on {{ $labels.instance }}"
          description: "In-flight requests exceeded 1000 for 2 minutes."

      - alert: BlazeServeConnectionsRejected
        expr: rate(blazeserve_connections_rejected_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Connections refused on {{ $labels.instance }}"
          description: "The admission limit (--max-connections) is rejecting connections. Raise it or add capacity."
