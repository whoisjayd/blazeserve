# Prometheus configuration for an in-cluster server scraping the internal ClusterIP service.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "blazeserve"
    metrics_path: "/__metrics__"
    static_configs:
      - targets: ["blazeserve.default.svc.cluster.local:80"]
        labels:
          environment: "kubernetes"
          service: "blazeserve"
          role: "edge-file-server"
