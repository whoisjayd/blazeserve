http:
  routers:
    blazeserve-router:
      rule: "PathPrefix(`/`)"
      service: blazeserve-service
      middlewares:
        - drop-forwarded
      entryPoints:
        - web

  middlewares:
    drop-forwarded:
      headers:
        customRequestHeaders:
          Forwarded: ""

  services:
    blazeserve-service:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8000"
        healthCheck:
          path: "/__live__"
          interval: "10s"
          timeout: "3s"
        passHostHeader: true
