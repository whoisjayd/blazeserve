services:
  blazeserve:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/whoisjayd/blazeserve:latest
    container_name: blazeserve
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Names without a value pass through from the host and stay unset otherwise,
    # so exporting is opt-in and no secret is stored in this file.
    environment:
      - BLAZE_LOG_JSON=1
      - BLAZE_TELEMETRY
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_EXPORTER_OTLP_HEADERS
      - OTEL_SERVICE_NAME
    command: ["serve", "/data", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 256M

  lgtm:
    profiles: ["observability"]
    image: grafana/otel-lgtm:0.40.0
    container_name: blazeserve-lgtm
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
