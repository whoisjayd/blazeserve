services:
  blazeserve:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/whoisjayd/blazeserve:latest
    container_name: blazeserve
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    # A name without a value passes through from the host and stays unset otherwise.
    environment:
      - BLAZE_LOG_JSON=1
      - BLAZE_TELEMETRY
    command: ["serve", "/data", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 256M
