services:
  blazeserve:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/whoisjayd/blazeserve:latest
    container_name: blazeserve
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      BLAZE_LOG_JSON: "1"
    command: ["serve", "/data", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/__live__', timeout=2).close()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
