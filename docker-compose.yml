services:
  blazeserve:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/whoisjayd/blazeserve:latest
    container_name: blazeserve
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - tmpfs:/tmp
    environment:
      - BLAZE_LOG_JSON=1
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/__live__').status == 200 else 1)\""]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  tmpfs:
