[package]
name = "blazeserve-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
blazeserve = { path = "..", default-features = false }
libfuzzer-sys = "0.4"

# Its own workspace: nightly and cargo-fuzz only.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "range"
path = "fuzz_targets/range.rs"
test = false
doc = false
bench = false

[[bin]]
name = "digest"
path = "fuzz_targets/digest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path"
path = "fuzz_targets/path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filename"
path = "fuzz_targets/filename.rs"
test = false
doc = false
bench = false
