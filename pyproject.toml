[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "blazeserve"
version = "1.0.0"
description = "HTTP file server for large static transfers: ranges, resumable get/put, TLS, auth, throttling, uploads, streaming ZIP, Prometheus metrics."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaydeep Solanki" }]
keywords = ["http", "file-server", "range", "resume", "download", "upload", "cli", "tls", "zip", "prometheus"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/whoisjayd/blazeserve"
Repository = "https://github.com/whoisjayd/blazeserve.git"
Issues = "https://github.com/whoisjayd/blazeserve/issues"
Releases = "https://github.com/whoisjayd/blazeserve/releases"

[tool.maturin]
bindings = "bin"
strip = true
include = [{ path = "LICENSE", format = "sdist" }]
